name: Deploy Snake Game

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Git revision to deploy'
        required: false
        default: ''
      udap_run_id:
        description: 'UDAP run ID'
        required: false
        default: ''

concurrency:
  group: deploy-${{ vars.TF_STATE_KEY }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: node server.test.js
      - name: Lint
        run: npx --yes eslint server.js

  provision:
    name: Provision
    needs: test
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.tf.outputs.public_ip }}
      instance_id: ${{ steps.tf.outputs.instance_id }}
      artifact_bucket: ${{ steps.tf.outputs.artifact_bucket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -input=false -out=tfplan \
            -var="ec2_public_key=${{ vars.EC2_PUBLIC_KEY }}"
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan
      - name: Read outputs
        id: tf
        working-directory: terraform
        run: |
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "artifact_bucket=$(terraform output -raw artifact_bucket)" >> "$GITHUB_OUTPUT"

  configure:
    name: Configure
    needs: provision
    runs-on: ubuntu-latest
    env:
      PUBLIC_IP: ${{ needs.provision.outputs.public_ip }}
      ARTIFACT_BUCKET: ${{ needs.provision.outputs.artifact_bucket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Package artifact
        run: |
          SHA="${{ inputs.revision || github.sha }}"
          ZIP="snake-game-${SHA}.zip"
          zip -r "$ZIP" server.js index.html package.json scripts/
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Upload artifact to S3
        run: aws s3 cp "$ZIP" "s3://$ARTIFACT_BUCKET/$ZIP" --region "$AWS_REGION"
      - name: Write SSH key
        run: |
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/deploy.pem
          chmod 600 /tmp/deploy.pem
      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                   -i /tmp/deploy.pem ec2-user@"$PUBLIC_IP" true 2>/dev/null; then
              echo "SSH ready"; break
            fi
            echo "Waiting for SSH ($i/30)..."; sleep 10
          done
      - name: Deploy artifact
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy.pem ec2-user@"$PUBLIC_IP" \
            AWS_REGION="$AWS_REGION" ARTIFACT_BUCKET="$ARTIFACT_BUCKET" ZIP="$ZIP" \
            bash -s <<'ENDSSH'
          set -euo pipefail

          # Install Node.js and unzip if not already present (in case user-data hasn't finished)
          command -v node >/dev/null 2>&1 || sudo dnf install -y nodejs
          command -v unzip >/dev/null 2>&1 || sudo dnf install -y unzip
          command -v aws >/dev/null 2>&1 || sudo dnf install -y aws-cli

          # Download and extract artifact
          aws s3 cp "s3://$ARTIFACT_BUCKET/$ZIP" /tmp/artifact.zip --region "$AWS_REGION"
          sudo mkdir -p /opt/snake-game
          sudo rm -rf /opt/snake-game/*
          sudo unzip -o /tmp/artifact.zip -d /opt/snake-game

          # Write systemd unit (idempotent — works even if user-data hasn't run yet)
          sudo tee /etc/systemd/system/snake-game.service > /dev/null <<'UNIT'
          [Unit]
          Description=Snake Game Node.js Server
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/snake-game
          ExecStart=/usr/bin/node server.js
          Restart=on-failure
          RestartSec=5
          Environment=PORT=80
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable snake-game
          sudo systemctl restart snake-game
          sudo systemctl status snake-game --no-pager
          ENDSSH
      - name: Cleanup key
        if: always()
        run: rm -f /tmp/deploy.pem

  verify:
    name: Verify
    needs: [provision, configure]
    runs-on: ubuntu-latest
    env:
      PUBLIC_IP: ${{ needs.provision.outputs.public_ip }}
    steps:
      - name: Wait for app
        run: |
          STATUS=000
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://$PUBLIC_IP/" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 10
          done
          [ "$STATUS" = "200" ] || { echo "ERROR: / did not return 200"; exit 1; }
      - name: Assert /health returns 200
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://$PUBLIC_IP/health")
          echo "/health -> $S"
          [ "$S" = "200" ] || { echo "FAIL: expected 200"; exit 1; }
          echo "PASS /health -> 200"
      - name: Assert /nonsense returns 404
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://$PUBLIC_IP/nonsense")
          echo "/nonsense -> $S"
          [ "$S" = "404" ] || { echo "FAIL: expected 404"; exit 1; }
          echo "PASS /nonsense -> 404"
      - name: Report live URL
        run: |
          printf 'Live URL: http://%s\n' "$PUBLIC_IP"
