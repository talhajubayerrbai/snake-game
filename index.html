<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0e0e0;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #4ecca3;
      text-shadow: 0 0 20px rgba(78,204,163,0.5);
    }
    #score-board {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }
    #score-board span { color: #4ecca3; font-weight: bold; }
    #game-container {
      position: relative;
      border: 3px solid #4ecca3;
      box-shadow: 0 0 30px rgba(78,204,163,0.4);
      border-radius: 4px;
    }
    canvas { display: block; background: #0f3460; }
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,52,96,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
    }
    #overlay h2 { font-size: 2rem; color: #e94560; margin-bottom: 10px; }
    #overlay p { color: #a0a0c0; margin-bottom: 6px; font-size: 1rem; }
    #overlay .final-score { color: #4ecca3; font-size: 1.3rem; margin: 10px 0; }
    button {
      margin-top: 18px;
      padding: 12px 32px;
      font-size: 1rem;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #38b28e; }
    #instructions {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #666a8a;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🐍 Snake</h1>
  <div id="score-board">
    Score: <span id="score">0</span>&nbsp;&nbsp;High Score: <span id="high-score">0</span>
  </div>
  <div id="game-container">
    <canvas id="canvas" width="480" height="480"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p id="overlay-msg">Use arrow keys or WASD to move</p>
      <div class="final-score" id="overlay-score"></div>
      <button id="btn">Play</button>
    </div>
  </div>
  <p id="instructions">Arrow keys / WASD · Eat the red food · Don't hit the walls or yourself</p>

  <script>
    const COLS = 24, ROWS = 24;
    const CELL = 20; // 480 / 24
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const overlayScore = document.getElementById('overlay-score');
    const btn = document.getElementById('btn');

    let snake, dir, nextDir, food, score, highScore, ticker, running;
    highScore = 0;

    function randomCell() {
      return { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    }

    function placeFood() {
      let pos;
      do {
        pos = randomCell();
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function init() {
      const mx = Math.floor(COLS / 2), my = Math.floor(ROWS / 2);
      snake = [{x: mx, y: my}, {x: mx-1, y: my}, {x: mx-2, y: my}];
      dir = {x: 1, y: 0};
      nextDir = {x: 1, y: 0};
      score = 0;
      scoreEl.textContent = '0';
      placeFood();
      running = true;
      overlay.style.display = 'none';
      if (ticker) clearInterval(ticker);
      ticker = setInterval(tick, 120);
    }

    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > highScore) { highScore = score; highScoreEl.textContent = highScore; }
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Grid dots
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        ctx.fillRect(c * CELL + CELL/2 - 1, r * CELL + CELL/2 - 1, 2, 2);
      }
      // Food
      ctx.fillStyle = '#e94560';
      ctx.shadowBlur = 12; ctx.shadowColor = '#e94560';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Snake
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length * 0.5;
        ctx.fillStyle = i === 0 ? '#4ecca3' : `rgba(78,${Math.floor(180*ratio)},${Math.floor(163*ratio)},${ratio})`;
        if (i === 0) { ctx.shadowBlur = 10; ctx.shadowColor = '#4ecca3'; }
        const pad = i === 0 ? 1 : 2;
        ctx.beginPath();
        ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad*2, CELL - pad*2, i === 0 ? 4 : 3);
        ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    function gameOver() {
      clearInterval(ticker);
      running = false;
      overlayTitle.textContent = 'Game Over';
      overlayTitle.style.color = '#e94560';
      overlayMsg.textContent = 'Better luck next time!';
      overlayScore.textContent = 'Score: ' + score;
      btn.textContent = 'Play Again';
      overlay.style.display = 'flex';
    }

    document.addEventListener('keydown', e => {
      if (!running) return;
      switch(e.key) {
        case 'ArrowUp':    case 'w': case 'W': if (dir.y === 0) nextDir = {x:0,y:-1}; break;
        case 'ArrowDown':  case 's': case 'S': if (dir.y === 0) nextDir = {x:0,y:1};  break;
        case 'ArrowLeft':  case 'a': case 'A': if (dir.x === 0) nextDir = {x:-1,y:0}; break;
        case 'ArrowRight': case 'd': case 'D': if (dir.x === 0) nextDir = {x:1,y:0};  break;
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
    });

    btn.addEventListener('click', init);
  </script>
</body>
</html>
